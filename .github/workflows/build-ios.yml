name: Build iOS IPA (Streamify)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - mainline
    paths:
      - 'mobile/**'
      - 'ios/**'
      - 'Static/**'
      - 'Scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'
    tags:
      - 'v*'

jobs:
  build-ios:
    name: Build iOS Application (.ipa)
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install npm Dependencies
        run: npm install --legacy-peer-deps

      - name: Sync Capacitor iOS Assets
        run: npm run mobile:sync

      # The runner's default Xcode can be older than 26. Only the iOS 26 SDK
      # gives system bars (the native tab bar) Liquid Glass, so pick the
      # newest Xcode 26 installed. Without one the build still works and the
      # app draws its own rounded tab bar instead.
      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE/Contents/Developer"
          else
            echo "::warning::No Xcode 26 on this runner; building with the default Xcode (no Liquid Glass)."
            ls -d /Applications/Xcode*.app || true
          fi
          xcodebuild -version

      - name: Build Xcode Archive
        run: |
          xcodebuild -version
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath ios/App/build/App.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package Unsigned IPA
        run: |
          mkdir -p build_output/Payload
          cp -r ios/App/build/App.xcarchive/Products/Applications/App.app build_output/Payload/Streamify.app
          cd build_output
          zip -qr Streamify-iOS.ipa Payload
          echo "IPA Size: $(du -h Streamify-iOS.ipa | cut -f1)"

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Streamify-iOS
          path: build_output/Streamify-iOS.ipa
          retention-days: 30

      - name: Attach IPA to GitHub Release (If Tagged)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build_output/Streamify-iOS.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
