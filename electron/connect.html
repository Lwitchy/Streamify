<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';">
<title>Connect your phone</title>
<style>
    :root {
        --bg: #121212;
        --panel: #1a1a1a;
        --border: #2c2c2c;
        --text: #e9e9e9;
        --muted: #9b9b9b;
        --accent: #1db954;
        --warn: #f0a020;
    }
    * { box-sizing: border-box; }
    body {
        margin: 0; padding: 26px 24px;
        background: var(--bg); color: var(--text);
        font: 14px/1.55 -apple-system, "Segoe UI", Roboto, sans-serif;
        user-select: none;
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 13px; margin: 0 0 20px; }

    .qr-wrap { text-align: center; margin-bottom: 20px; }
    .qr-wrap img {
        width: 220px; height: 220px;
        background: #fff; padding: 10px; border-radius: 12px;
    }
    .qr-missing {
        padding: 40px 18px; border: 1px dashed var(--border);
        border-radius: 12px; color: var(--muted); font-size: 13px;
    }

    .addr {
        display: flex; align-items: center; justify-content: space-between;
        gap: 10px; background: var(--panel); border: 1px solid var(--border);
        border-radius: 9px; padding: 11px 13px; margin-bottom: 9px;
    }
    .addr code {
        font-family: Consolas, "Courier New", monospace;
        font-size: 13.5px; color: var(--accent);
        user-select: text; cursor: text; word-break: break-all;
    }
    .addr .iface { color: var(--muted); font-size: 11.5px; }
    button.copy {
        background: #2a2a2a; color: var(--text); border: 1px solid var(--border);
        border-radius: 6px; padding: 5px 11px; font-size: 12px; cursor: pointer;
        flex-shrink: 0;
    }
    button.copy:hover { background: #343434; }
    button.copy.done { background: var(--accent); color: #04180c; border-color: var(--accent); }

    .notice {
        margin-top: 18px; padding: 13px 15px; border-radius: 9px;
        font-size: 12.5px; line-height: 1.6;
    }
    .notice.warn {
        background: rgba(240,160,32,.09);
        border: 1px solid rgba(240,160,32,.35);
        color: #f5c877;
    }
    .notice.ok {
        background: rgba(29,185,84,.09);
        border: 1px solid rgba(29,185,84,.32);
        color: #86e0aa;
    }
    .notice b { color: #fff; }
    .notice code {
        background: rgba(255,255,255,.08); padding: 1px 5px;
        border-radius: 4px; font-size: 12px;
    }
    .empty { color: var(--muted); font-size: 13px; text-align: center; padding: 26px 0; }
</style>
</head>
<body>

<h1>Connect your phone</h1>
<p class="sub">Scan the code, or type an address into your phone's browser.
   Both devices must be on the same Wi-Fi network.</p>

<div id="content"><p class="empty">Loading…</p></div>

<script>
(function () {
    const root = document.getElementById('content');

    function esc(s) {
        return String(s).replace(/[&<>"']/g, c =>
            ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }

    function render(info) {
        if (!info.addresses || info.addresses.length === 0) {
            root.innerHTML =
                '<p class="empty">No network connection detected.<br>' +
                'Connect this computer to Wi-Fi or Ethernet, then reopen this window.</p>';
            return;
        }

        let html = '';

        html += '<div class="qr-wrap">';
        if (info.qr) {
            html += '<img alt="QR code" src="' + esc(info.qr) + '">';
        } else {
            html += '<div class="qr-missing">QR code unavailable — use an address below.</div>';
        }
        html += '</div>';

        info.addresses.forEach((a, i) => {
            html +=
                '<div class="addr">' +
                  '<div>' +
                    '<code>' + esc(a.url) + '</code>' +
                    '<div class="iface">' + esc(a.interface) + '</div>' +
                  '</div>' +
                  '<button class="copy" data-url="' + esc(a.url) + '">Copy</button>' +
                '</div>';
        });

        // The honest part: explain exactly what does and does not work.
        if (info.secure) {
            html +=
                '<div class="notice ok">' +
                  '<b>HTTPS is on.</b> Phones get the full experience: offline ' +
                  'downloads, and "Add to Home Screen" to install Streamify as an app.' +
                  '<br><br>Your certificate is self-signed, so each phone shows a ' +
                  'security warning once. Trust the certificate on the device to ' +
                  'remove it permanently.' +
                '</div>';
        } else {
            html +=
                '<div class="notice warn">' +
                  '<b>Running over plain HTTP.</b> Streaming, search, playlists and ' +
                  'lock-screen controls all work normally.' +
                  '<br><br>Browsers reserve these for secure connections, so on phones ' +
                  'they are unavailable:' +
                  '<br>• Offline downloads' +
                  '<br>• "Add to Home Screen" (installing as an app)' +
                  '<br>• Keeping the screen awake on the lyrics view' +
                  '<br><br>To enable them, run <code>npm run gen-cert</code> and restart.' +
                '</div>';
        }

        root.innerHTML = html;

        root.querySelectorAll('button.copy').forEach(btn => {
            btn.addEventListener('click', () => {
                const url = btn.getAttribute('data-url');
                navigator.clipboard.writeText(url).then(() => {
                    btn.textContent = 'Copied';
                    btn.classList.add('done');
                    setTimeout(() => {
                        btn.textContent = 'Copy';
                        btn.classList.remove('done');
                    }, 1400);
                }).catch(() => { btn.textContent = 'Failed'; });
            });
        });
    }

    if (!window.streamifyDesktop) {
        root.innerHTML = '<p class="empty">Desktop bridge unavailable.</p>';
        return;
    }

    window.streamifyDesktop.getConnectionInfo()
        .then(render)
        .catch(err => {
            root.innerHTML = '<p class="empty">Failed to load: ' + esc(err.message) + '</p>';
        });
})();
</script>

</body>
</html>
